<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registry</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/registry.css') }}">
</head>
<body>
<nav class="topbar">
  <div class="topbar-left">
    <div class="view-tabs">
      <button class="view-tab active" data-view="entries">Entries</button>
      <button class="view-tab" data-view="code">Code</button>
      <button class="view-tab" data-view="export">Export <span class="tab-badge hidden" id="export-tab-badge"></span></button>
    </div>
    <div class="topbar-sep"></div>
    <div id="entries-toolbar" class="topbar-toolbar-section">
      <div class="kind-group" id="kind-tabs">
        <button class="kind-tab active" data-kind="all">All</button>
        <button class="kind-tab" data-kind="data">Data</button>
        <button class="kind-tab" data-kind="figure">Figure</button>
      </div>
    </div>
    <div id="code-toolbar" class="topbar-toolbar-section" style="display:none">
      <div class="kind-group" id="code-browse-tabs">
        <button class="kind-tab active" data-browse="version">By version</button>
        <button class="kind-tab" data-browse="class">By class</button>
      </div>
      <div class="kind-group" id="code-kind-tabs">
        <button class="kind-tab active" data-code-kind="all">All</button>
        <button class="kind-tab" data-code-kind="data">Data</button>
        <button class="kind-tab" data-code-kind="figure">Figure</button>
      </div>
    </div>
  </div>
  <div class="topbar-right">
    <div id="entries-toolbar-right" class="topbar-toolbar-section">
      <div class="kind-group" id="entries-screen-tabs">
        <button class="kind-tab active" data-mode="compact">Compact</button>
        <button class="kind-tab" data-mode="detailed">Detailed</button>
      </div>
      <div class="kind-group" id="display-seg">
        <button class="kind-tab" data-val="selected">Selected params</button>
        <button class="kind-tab active" data-val="all">All params</button>
      </div>
      <div class="kind-group"><button class="kind-tab" id="btn-hide-stale">Hide stale</button></div>
      <div class="kind-group"><button class="kind-tab" id="btn-select-mode" title="Toggle entry selection for export">Select</button></div>
    </div>
    <div id="code-toolbar-right" class="topbar-toolbar-section" style="display:none">
      <div class="kind-group"><button class="kind-tab" id="btn-hide-empty-versions">Hide empty</button></div>
    </div>
    <button class="ghost-btn topbar-icon-btn" id="btn-diag" title="Diagnostics">ⓘ</button>
    <div class="topbar-menu-wrap" id="topbar-menu-wrap">
      <button class="ghost-btn topbar-icon-btn" id="btn-menu" title="Menu">⋮</button>
      <div class="topbar-menu hidden" id="topbar-menu">
        <button class="topbar-menu-item" id="menu-reload">Reload from disk</button>
        <button class="topbar-menu-item" id="menu-reimport">Reimport Python files</button>
        <div class="topbar-menu-sep"></div>
        <button class="topbar-menu-item" id="menu-clean-cache">Clean cache…</button>
        <button class="topbar-menu-item" id="menu-clean-registry">Clean registry…</button>
      </div>
    </div>
  </div>
</nav>

<div class="view-entries">
<div class="app-layout mode-compact">
  <aside class="sidebar" id="entries-sidebar">
    <div class="sb-count-row">
      <span class="count-chip" id="entry-count"></span>
    </div>
    <div class="sb-pills-row pills-empty" id="pills-row">
      <div class="active-pills" id="active-pills"></div>
      <button class="clear-all-btn hidden" id="btn-clear-all" title="Clear all filters">Clear all</button>
      <span class="sb-no-filters">No filters active</span>
    </div>

    <div class="sb-section collapsible" id="sec-search">
      <button class="sb-section-hd" data-target="sec-search">
        <span class="sb-section-title">Search</span>
        <span class="sb-chevron">▾</span>
      </button>
      <div class="sb-section-body">
        <div class="logic-row">
          <span class="sb-label">Mode</span>
          <div class="kind-tabs" id="logic-seg">
            <button class="kind-tab active" data-val="AND">AND</button>
            <button class="kind-tab" data-val="OR">OR</button>
            <button class="kind-tab" data-val="NOT">NOT</button>
          </div>
        </div>
        <div id="filter-rows"></div>
        <button class="add-row-btn" id="add-filter">＋ Add filter</button>
      </div>
    </div>

    <div class="sb-section collapsible" id="sec-spec">
      <button class="sb-section-hd" data-target="sec-spec">
        <span class="sb-section-title">Spec filters</span>
        <span class="sb-chevron">▾</span>
      </button>
      <div class="sb-section-body">
        <div class="spec-grid-sidebar">
          <div class="spec-group">
            <div class="sb-label">CRS</div>
            <div class="spec-pills" id="spec-crs"></div>
          </div>
          <div class="spec-group">
            <div class="sb-label">Resolution</div>
            <div class="spec-pills" id="spec-resolution"></div>
          </div>
          <div class="spec-group spec-group--wide">
            <div class="sb-label">Bounds</div>
            <div class="spec-pills" id="spec-bounds"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="sb-section collapsible" id="sec-display">
      <button class="sb-section-hd" data-target="sec-display">
        <span class="sb-section-title">Snapshots</span>
        <span class="sb-chevron">▾</span>
      </button>
      <div class="sb-section-body">
        <select class="version-select" id="version-select">
          <option value="all">All snapshots</option>
        </select>
      </div>
    </div>

    <div class="sb-section sb-section--classes" id="sec-classes">
      <div class="sb-section-hd sb-section-hd--static" id="btn-classes-hd">
        <span class="sb-section-title">Classes</span>
        <span class="sb-section-meta" id="class-count-badge"></span>
        <div class="class-list-toolbar">
          <button class="toggle-btn" id="btn-show-empty">Show empty</button>
          <button class="toggle-btn" id="btn-multi-select">Multi-select</button>
        </div>
      </div>
      <div class="class-filter-row">
        <input class="code-filter" id="entry-class-filter" placeholder="Filter classes…">
      </div>
      <div class="class-list" id="class-list"></div>
    </div>
  </aside>

  <main class="main-pane" id="main-pane">
    <!-- Compact view: pill list of entries -->
    <div class="entry-pill-list" id="entry-pill-list"></div>

    <!-- Detailed view: full param table -->
    <div class="table-scroll" id="table-scroll-wrap">
      <table>
        <colgroup>
          <col class="col-indent">
          <col class="col-group">
          <col class="col-param">
          <col class="col-value">
        </colgroup>
        <thead><tr id="table-head"></tr></thead>
        <tbody id="table-body"></tbody>
      </table>
    </div>
  </main>

  <div class="resize-handle" id="resize-handle"></div>
  <aside class="detail-pane" id="detail-pane">
    <div class="detail-scroll" id="entry-detail"></div>
  </aside>
</div>

</div><!-- .view-entries -->

<div class="view-code" style="display:none">
  <div class="code-pane code-pane--versions">
    <div class="code-pane-filter-row" id="code-versions-filter-row">
      <input class="code-filter" id="code-filter-classes" placeholder="Filter classes…" style="display:none">
    </div>
    <div class="code-version-list" id="code-version-list"></div>
  </div>
  <div class="code-pane code-pane--classes">
    <div class="code-pane-filter-row">
      <input class="code-filter" id="code-filter" placeholder="Filter…">
    </div>
    <div class="code-class-list" id="code-class-list"></div>
  </div>
  <div class="code-pane code-pane--source">
    <div class="code-source-actions" id="code-source-hd">
      <span class="pane-title" id="code-source-title"></span>
      <span class="main-hd-spacer"></span>
      <button class="act-btn" id="btn-find-in-entries" style="display:none">Find entries</button>
    </div>
    <div class="code-diff-bar" id="code-diff-controls" style="display:none">
      <div class="kind-group" id="code-src-diff-seg">
        <button class="kind-tab active" data-srcmode="source">Source</button>
        <button class="kind-tab"        data-srcmode="diff">Diff</button>
      </div>
      <div class="kind-group seg-disabled" id="code-diff-mode-seg">
        <button class="kind-tab active" data-dmode="inline">Inline</button>
        <button class="kind-tab"        data-dmode="split">Side by side</button>
      </div>
      <div class="kind-group seg-disabled" id="code-diff-expand-seg">
        <button class="kind-tab active" data-expand="hunks">Hunks</button>
        <button class="kind-tab"        data-expand="full">Full</button>
      </div>
    </div>
    <div class="code-source-panel" id="code-source-panel"></div>
  </div>
</div>

<div class="view-export" style="display:none">
  <div class="export-card">
    <div class="export-card-hd">
      <span class="export-card-title">Export</span>
      <span class="export-toolbar-count" id="export-toolbar-count">0 entries</span>
      <span class="main-hd-spacer"></span>
      <div class="export-progress hidden" id="export-progress">
        <div class="loading-bar-track export-progress-track">
          <div class="loading-bar-fill" id="export-progress-bar"></div>
        </div>
        <span class="export-progress-label" id="export-progress-label"></span>
      </div>
      <button class="act-btn" id="btn-export-download" disabled>Download .tar</button>
    </div>
    <div class="export-card-body">
      <div class="export-empty hidden" id="export-empty">No entries selected. Use the <strong>Select</strong> toggle to add entries.</div>
      <div class="table-scroll" id="export-table-scroll" style="display:none;">
        <table>
          <colgroup>
            <col class="col-indent">
            <col class="col-group">
            <col class="col-param">
            <col class="col-value">
          </colgroup>
          <thead><tr id="export-table-head"></tr></thead>
          <tbody id="export-table-body"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="modal">
  <div class="modal-card">
    <div class="modal-bar"><span class="modal-title" id="modal-title"></span><button class="modal-close" id="modal-close">✕</button></div>
    <div class="modal-content" id="modal-body"></div>
  </div>
</div>
<div class="loading-overlay hidden" id="loading-overlay">
  <div class="loading-box">
    <div class="loading-label" id="loading-label">Loading…</div>
    <div class="loading-bar-track"><div class="loading-bar-fill" id="loading-bar-fill"></div></div>
    <div class="loading-sub" id="loading-sub"></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script type="module" src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
