<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  html, body { margin: 0; padding: 0; height: 100%; font: 12px/1.4 system-ui, sans-serif; background: #fafaf8; }
  #map  { height: calc(100% - 32px); }
  #info { padding: 6px 10px; color: #555; font-size: 11px; font-family: monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>
</head>
<body>
<div id="map"></div>
<div id="info">{{ label }} &nbsp;·&nbsp; {{ crs }}</div>
<script>
  var map = L.map('map');
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap contributors', maxZoom: 18
  }).addTo(map);
  var bounds = [[{{ lat_min }}, {{ lon_min }}], [{{ lat_max }}, {{ lon_max }}]];
  L.rectangle(bounds, { color: '#0b6668', weight: 2, fillOpacity: 0.15 }).addTo(map);
  map.fitBounds(bounds, { padding: [30, 30] });
</script>
</body>
</html>
