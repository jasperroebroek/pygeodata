[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pygeodata"
description = "Lightweight framework for geospatial data access and processing"
authors = [
    { name = "Jasper Roebroek", email = "roebroek.jasper@gmail.com" }
]
version = "0.1.0"
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
keywords = []
classifiers = [
    "Programming Language :: Python :: 3"
]
dependencies = [
    "rioxarray",
    "geopandas",
    "zarr",
    "fiona",
    "pyarrow",
    "filelock",
]

[tool.setuptools.packages.find]
include = ["pygeodata*"]

[project.optional-dependencies]
viz = [
    "graphviz",
]
parallel = [
    "dask",
    "distributed",
]
dashboard = [
    "flask",
]
test = [
    "pytest",
    "pytest-mock",
]
documentation = [
    "sphinx",
    "sphinx_rtd_theme",
    "numpydoc",
    "jupyter",
    "matplotlib",
]
all = [
    "pygeodata[viz]",
    "pygeodata[parallel]",
    "pygeodata[dashboard]",
    "pygeodata[test]",
    "pygeodata[documentation]",
]
