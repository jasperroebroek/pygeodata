[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pygeodata"
description = "Lightweight framework for geospatial data access and processing"
authors = [
    { name = "Jasper Roebroek", email = "roebroek.jasper@gmail.com" }
]
dynamic = ["version"]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
keywords = []
classifiers = [
    "Programming Language :: Python :: 3"
]
dependencies = [
    "numpy",
    "rioxarray",
    "geopandas",
    "zarr",
    "fiona",
    "pyarrow",
    "filelock",
    "sqlalchemy",
    "click",
]

[project.scripts]
pygeodata = "pygeodata.cli:cli"

[tool.setuptools.dynamic]
version = { attr = "pygeodata.__version__" }

[tool.setuptools.packages.find]
include = ["pygeodata*"]

[project.optional-dependencies]
viz = [
    "graphviz",
]
parallel = [
    "dask",
    "distributed",
]
browser = [
    "pygeodata-browser",
]
test = [
    "pytest",
    "pytest-mock",
]

documentation = [
    "sphinx",
    "sphinx_rtd_theme",
    "numpydoc",
    "jupyter",
    "matplotlib",
]
all = [
    "pygeodata[viz]",
    "pygeodata[parallel]",
    "pygeodata[browser]",
    "pygeodata[test]",
    "pygeodata[documentation]",
]

[tool.pytest.ini_options]
pythonpath = ["."]
