[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "pygeodata"
description = "Lightweight framework for geospatial data access and processing"
authors = [
    { name = "Jasper Roebroek", email = "roebroek.jasper@gmail.com" }
]
dynamic = ["version"]  # from the git tag (setuptools-scm)
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.11"
keywords = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy",
    "rioxarray",
    "geopandas",
    "zarr",
    "fiona",
    "pyarrow",
    "affine>=3",
    "filelock",
    "click",
    "lazy_loader>=0.4",
    "msgspec",
]

[project.urls]
Repository = "https://github.com/jasperroebroek/pygeodata"
Issues = "https://github.com/jasperroebroek/pygeodata/issues"

[project.scripts]
pygeodata = "pygeodata.cli:cli"

[tool.setuptools_scm]

[tool.setuptools.packages.find]
include = ["pygeodata*"]

[tool.setuptools.package-data]
pygeodata = ["*.pyi"]

[project.optional-dependencies]
viz = [
    "graphviz",
]
parallel = [
    "dask",
    "distributed",
]
browser = [
    "pygeodata-browser>=0.1.0",
]
test = [
    "pytest",
    "pytest-mock",
]

documentation = [
    "sphinx",
    "sphinx_rtd_theme",
    "numpydoc",
    "jupyter",
    "matplotlib",
]
all = [
    "pygeodata[viz]",
    "pygeodata[parallel]",
    "pygeodata[browser]",
    "pygeodata[test]",
    "pygeodata[documentation]",
]

[tool.pytest.ini_options]
pythonpath = ["."]
