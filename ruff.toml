line-length = 120
indent-width = 4

exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

[lint]
select = ["ALL"]
ignore = [
    "ANN003",
    "ANN204",
    "ANN401",
    "B009",
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D105",
    "EM101",
    "EM102",
    "FBT001",
    "FBT002",
    "N806",
    "PD010",
    "PLR0915",
    "PLR2004", 
    "PLC0206",
    "T201",
    "TC002",
    "TD002",
    "TD003",
    "TRY003",
    "Q000"
] 

[lint.pydocstyle]
convention = "numpy"

[format]
quote-style = "single"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
